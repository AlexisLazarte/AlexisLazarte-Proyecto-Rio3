server {
    listen 80;
    server_name TUDOMINIO www.TUDOMINIO;

    # Redirigir a HTTPS (Certbot completa esto)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name TUDOMINIO www.TUDOMINIO;

    # Certificados SSL (Certbot los completa automáticamente)
    # ssl_certificate     /etc/letsencrypt/live/TUDOMINIO/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/TUDOMINIO/privkey.pem;

    # Logs
    access_log /var/log/nginx/rio3_access.log;
    error_log  /var/log/nginx/rio3_error.log;

    # Límite de tamaño para subida de fotos (10 MB)
    client_max_body_size 10M;

    # Archivos estáticos (CSS, JS, imágenes del sitio)
    location /static/ {
        alias /var/www/rio3/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Archivos media (fotos subidas por el admin)
    location /media/ {
        alias /var/www/rio3/backend/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Todo lo demás va a Django via Gunicorn
    location / {
        include         proxy_params;
        proxy_pass      http://unix:/run/gunicorn/rio3.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
